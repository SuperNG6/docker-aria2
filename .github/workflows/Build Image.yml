name: 构建 Aria2 Docker 镜像

on:
  workflow_dispatch:

env:
  DOCKER_IMAGE: superng6/aria2
  GHCR_IMAGE: ghcr.io/superng6/aria2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v7
          - linux/arm64
        variant:
          - standard
          - a2b
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送单架构镜像（by digest）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            A2B_DEFAULT=${{ matrix.variant == 'a2b' && 'true' || 'false' }}
          tags: |-
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform }}

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "PLATFORM_PAIR=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_ENV

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  merge-standard:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: 设置版本标签
        id: set-version
        run: echo "version=$(date +"%y-%m-%d")" >> $GITHUB_OUTPUT

      - name: 下载 standard digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-standard-*
          merge-multiple: true

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest 并推送（standard）
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:dev-latest" \
            -t "${{ env.DOCKER_IMAGE }}:dev-${{ steps.set-version.outputs.version }}" \
            -t "${{ env.GHCR_IMAGE }}:dev-latest" \
            -t "${{ env.GHCR_IMAGE }}:dev-${{ steps.set-version.outputs.version }}" \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

      - name: 检查镜像（standard）
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:dev-latest
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:dev-${{ steps.set-version.outputs.version }}

  merge-a2b:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: 设置版本标签
        id: set-version
        run: echo "version=$(date +"%y-%m-%d")" >> $GITHUB_OUTPUT

      - name: 下载 a2b digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-a2b-*
          merge-multiple: true

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest 并推送（a2b）
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:a2b-dev-latest" \
            -t "${{ env.DOCKER_IMAGE }}:a2b-dev-${{ steps.set-version.outputs.version }}" \
            -t "${{ env.GHCR_IMAGE }}:a2b-dev-latest" \
            -t "${{ env.GHCR_IMAGE }}:a2b-dev-${{ steps.set-version.outputs.version }}" \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

      - name: 检查镜像（a2b）
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:a2b-dev-latest
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:a2b-dev-${{ steps.set-version.outputs.version }}
