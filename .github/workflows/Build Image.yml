name: 构建 Aria2 Docker 镜像

on:
  workflow_dispatch:

env:
  DOCKER_IMAGE: superng6/aria2
  GHCR_IMAGE: ghcr.io/superng6/aria2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v7
          - linux/arm64
        variant:
          - standard
          - a2b
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送单架构镜像（by digest）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            A2B_DEFAULT=${{ matrix.variant == 'a2b' && 'true' || 'false' }}
          tags: |-
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform }}

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "PLATFORM_PAIR=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_ENV

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  merge-standard:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: 设置版本标签
        id: set-version
        run: echo "version=$(date +"%y-%m-%d")" >> $GITHUB_OUTPUT

      - name: 下载 standard digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-standard-*
          merge-multiple: true

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest 并推送（standard）
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:dev-latest" \
            -t "${{ env.DOCKER_IMAGE }}:dev-${{ steps.set-version.outputs.version }}" \
            -t "${{ env.GHCR_IMAGE }}:dev-latest" \
            -t "${{ env.GHCR_IMAGE }}:dev-${{ steps.set-version.outputs.version }}" \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

      - name: 检查镜像（standard）
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:dev-latest
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:dev-${{ steps.set-version.outputs.version }}
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:dev-latest
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:dev-${{ steps.set-version.outputs.version }}

  merge-a2b:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: 设置版本标签
        id: set-version
        run: echo "version=$(date +"%y-%m-%d")" >> $GITHUB_OUTPUT

      - name: 下载 a2b digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-a2b-*
          merge-multiple: true

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest 并推送（a2b）
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:a2b-dev-latest" \
            -t "${{ env.DOCKER_IMAGE }}:a2b-dev-${{ steps.set-version.outputs.version }}" \
            -t "${{ env.GHCR_IMAGE }}:a2b-dev-latest" \
            -t "${{ env.GHCR_IMAGE }}:a2b-dev-${{ steps.set-version.outputs.version }}" \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

      - name: 检查镜像（a2b）
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:a2b-dev-latest
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:a2b-dev-${{ steps.set-version.outputs.version }}
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:a2b-dev-latest
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:a2b-dev-${{ steps.set-version.outputs.version }}

  smoke-test:
    name: 运行检查（${{ matrix.variant }}）
    runs-on: ubuntu-latest
    needs:
      - merge-standard
      - merge-a2b
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag: dev-latest
            rpc_port: 16800
            web_port: 18080
            a2b_enabled: "false"
          - variant: a2b
            tag: a2b-dev-latest
            rpc_port: 16801
            web_port: 18081
            a2b_enabled: "true"
    steps:
      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取镜像
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ matrix.tag }}
        run: docker pull "${IMAGE}"

      - name: 启动容器
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ matrix.tag }}
          RPC_PORT: ${{ matrix.rpc_port }}
          WEB_PORT: ${{ matrix.web_port }}
          A2B_ENABLED: ${{ matrix.a2b_enabled }}
        run: |
          docker_args=(
            -d
            --name "${CONTAINER_NAME}"
            -p "${RPC_PORT}:6800"
            -p "${WEB_PORT}:8080"
            -e SECRET=smoketoken
            -e UT=false
            -e RUT=false
            -e WEBUI=true
            -e PORT=6800
            -e WEBUI_PORT=8080
            -e "A2B=${A2B_ENABLED}"
          )

          if [ "${A2B_ENABLED}" = "true" ]; then
            docker_args+=(--cap-add NET_ADMIN)
            if [ -d /lib/modules ]; then
              docker_args+=(-v /lib/modules:/lib/modules:ro)
            fi
          fi

          docker run "${docker_args[@]}" "${IMAGE}"

      - name: 等待并检查服务
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}
          RPC_PORT: ${{ matrix.rpc_port }}
          WEB_PORT: ${{ matrix.web_port }}
          A2B_ENABLED: ${{ matrix.a2b_enabled }}
        run: |
          echo "Observe container logs for 30 seconds before probing services..."
          timeout 30s docker logs -f "${CONTAINER_NAME}" || true
          echo "Start service probes."

          for i in {1..10}; do
            if docker ps --filter "name=${CONTAINER_NAME}" --filter "status=running" --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}" \
              && curl -fsS "http://127.0.0.1:${RPC_PORT}/jsonrpc" \
                -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"2.0","method":"aria2.getVersion","id":"smoke","params":["token:smoketoken"]}' \
                > /tmp/aria2-rpc.json 2> /tmp/aria2-rpc.err \
              && grep -q '"version"' /tmp/aria2-rpc.json \
              && curl -fsS "http://127.0.0.1:${WEB_PORT}/" >/dev/null 2> /tmp/aria2-web.err; then
              if [ "${A2B_ENABLED}" = "true" ] && ! docker top "${CONTAINER_NAME}" | grep -q '[a]ria2b'; then
                sleep 2
                continue
              fi
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done

          docker ps -a
          [ -f /tmp/aria2-rpc.json ] && cat /tmp/aria2-rpc.json || true
          [ -f /tmp/aria2-rpc.err ] && cat /tmp/aria2-rpc.err || true
          [ -f /tmp/aria2-web.err ] && cat /tmp/aria2-web.err || true
          docker logs "${CONTAINER_NAME}" || true
          exit 1

      - name: 清理容器
        if: always()
        run: docker rm -f "aria2-smoke-${{ matrix.variant }}" || true
