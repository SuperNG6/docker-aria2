name: 构建 Aria2 Docker 镜像

on:
  workflow_dispatch:

env:
  DOCKER_IMAGE: superng6/aria2
  GHCR_IMAGE: ghcr.io/superng6/aria2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v7
          - linux/arm64
        variant:
          - standard
          - a2b
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录到 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送单架构镜像（by digest）
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            A2B_DEFAULT=${{ matrix.variant == 'a2b' && 'true' || 'false' }}
          tags: |-
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # 不启用 buildx cache：项目本身很轻量，且 Dockerfile 里的 aria2b/AriaNg/aria2c
          # 拉的是 GitHub Releases 最新版（curl + grep），缓存命中会让用户拿到旧版本

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "PLATFORM_PAIR=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_ENV

      - name: 上传 digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: 合并 manifest（${{ matrix.variant }}）
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke-test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag_prefix: dev-       # 推 :dev-latest / :dev-<date>
          - variant: a2b
            tag_prefix: a2b-dev-   # 推 :a2b-dev-latest / :a2b-dev-<date>
    steps:
      - name: 设置版本标签
        id: set-version
        run: echo "version=$(date +"%y-%m-%d")" >> $GITHUB_OUTPUT

      - name: 下载 ${{ matrix.variant }} digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录到 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest 并推送（${{ matrix.variant }}）
        working-directory: /tmp/digests
        env:
          TAG_LATEST: ${{ matrix.tag_prefix }}latest
          TAG_DATED: ${{ matrix.tag_prefix }}${{ steps.set-version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:${TAG_LATEST}" \
            -t "${{ env.DOCKER_IMAGE }}:${TAG_DATED}" \
            -t "${{ env.GHCR_IMAGE }}:${TAG_LATEST}" \
            -t "${{ env.GHCR_IMAGE }}:${TAG_DATED}" \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

      - name: 检查镜像（${{ matrix.variant }}）
        env:
          TAG_LATEST: ${{ matrix.tag_prefix }}latest
          TAG_DATED: ${{ matrix.tag_prefix }}${{ steps.set-version.outputs.version }}
        run: |
          docker buildx imagetools inspect "${{ env.DOCKER_IMAGE }}:${TAG_LATEST}"
          docker buildx imagetools inspect "${{ env.DOCKER_IMAGE }}:${TAG_DATED}"
          docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${TAG_LATEST}"
          docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${TAG_DATED}"

  smoke-test:
    name: 运行检查（${{ matrix.variant }}）
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            rpc_port: 16800
            web_port: 18080
            a2b_enabled: "false"
          - variant: a2b
            rpc_port: 16801
            web_port: 18081
            a2b_enabled: "true"
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载 amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-${{ matrix.variant }}-linux-amd64
          path: /tmp/digest

      - name: 拉取镜像（按 digest，未发布 tag）
        id: pull
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
        run: |
          digest=$(ls /tmp/digest | head -1)
          if [ -z "${digest}" ]; then
            echo "digest 文件为空，artifact 异常"
            exit 1
          fi
          ref="${GHCR_IMAGE}@sha256:${digest}"
          echo "image=${ref}" >> "$GITHUB_OUTPUT"
          docker pull "${ref}"

      - name: 启动容器
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}
          IMAGE: ${{ steps.pull.outputs.image }}
          RPC_PORT: ${{ matrix.rpc_port }}
          WEB_PORT: ${{ matrix.web_port }}
          A2B_ENABLED: ${{ matrix.a2b_enabled }}
        run: |
          docker_args=(
            -d
            --name "${CONTAINER_NAME}"
            -p "${RPC_PORT}:6800"
            -p "${WEB_PORT}:8080"
            -e SECRET=smoketoken
            -e UT=false
            -e RUT=false
            -e WEBUI=true
            -e PORT=6800
            -e WEBUI_PORT=8080
            -e "A2B=${A2B_ENABLED}"
          )

          if [ "${A2B_ENABLED}" = "true" ]; then
            docker_args+=(--cap-add NET_ADMIN)
            if [ -d /lib/modules ]; then
              docker_args+=(-v /lib/modules:/lib/modules:ro)
            fi
          fi

          docker run "${docker_args[@]}" "${IMAGE}"

      - name: 等待并检查服务
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}
          RPC_PORT: ${{ matrix.rpc_port }}
          WEB_PORT: ${{ matrix.web_port }}
          A2B_ENABLED: ${{ matrix.a2b_enabled }}
        run: |
          echo "Observe container logs for 30 seconds before probing services..."
          timeout 30s docker logs -f "${CONTAINER_NAME}" || true
          echo "Start service probes."

          for i in {1..10}; do
            if docker ps --filter "name=${CONTAINER_NAME}" --filter "status=running" --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}" \
              && curl -fsS "http://127.0.0.1:${RPC_PORT}/jsonrpc" \
                -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"2.0","method":"aria2.getVersion","id":"smoke","params":["token:smoketoken"]}' \
                > /tmp/aria2-rpc.json 2> /tmp/aria2-rpc.err \
              && grep -q '"version"' /tmp/aria2-rpc.json \
              && curl -fsS "http://127.0.0.1:${WEB_PORT}/" >/dev/null 2> /tmp/aria2-web.err; then
              if [ "${A2B_ENABLED}" = "true" ] && ! docker top "${CONTAINER_NAME}" | grep -q '[a]ria2b'; then
                sleep 2
                continue
              fi
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done

          docker ps -a
          [ -f /tmp/aria2-rpc.json ] && cat /tmp/aria2-rpc.json || true
          [ -f /tmp/aria2-rpc.err ] && cat /tmp/aria2-rpc.err || true
          [ -f /tmp/aria2-web.err ] && cat /tmp/aria2-web.err || true
          docker logs "${CONTAINER_NAME}" || true
          exit 1

      - name: RPC 集成测试（${{ matrix.variant }}）
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}
          RPC_PORT: ${{ matrix.rpc_port }}
        run: |
          chmod +x .github/scripts/rpc-integration-test.sh
          .github/scripts/rpc-integration-test.sh \
            127.0.0.1 "${RPC_PORT}" smoketoken "${CONTAINER_NAME}" "${{ matrix.variant }}"

      - name: 库单元测试（容器内·${{ matrix.variant }}）
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}
        run: |
          docker cp .github/scripts/in-container-lib-test.sh \
            "${CONTAINER_NAME}":/tmp/in-container-lib-test.sh
          docker exec "${CONTAINER_NAME}" bash /tmp/in-container-lib-test.sh

      - name: 失败时收集诊断信息
        if: failure()
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}
        run: |
          echo "=== docker ps -a ==="
          docker ps -a
          echo "=== docker logs (尾 200 行) ==="
          docker logs --tail 200 "${CONTAINER_NAME}" || true
          echo "=== /config 主要文件 ==="
          docker exec "${CONTAINER_NAME}" sh -c "
            cat /config/setting.conf 2>/dev/null
            echo '--- move.log ---'; tail -50 /config/logs/move.log 2>/dev/null
            echo '--- filter.log ---'; tail -50 /config/logs/文件过滤日志.log 2>/dev/null
          " || true

      - name: 清理容器
        if: always()
        run: docker rm -f "aria2-smoke-${{ matrix.variant }}" || true
