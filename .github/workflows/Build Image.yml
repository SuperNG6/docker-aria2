name: 构建 Aria2 Docker 镜像

on:
  workflow_dispatch:

env:
  DOCKER_IMAGE: superng6/aria2
  GHCR_IMAGE: ghcr.io/superng6/aria2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v7
          - linux/arm64
        variant:
          - standard
          - a2b
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录到 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送单架构镜像（by digest）
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            A2B_DEFAULT=${{ matrix.variant == 'a2b' && 'true' || 'false' }}
          tags: |-
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # 不启用 buildx cache：项目本身很轻量，且 Dockerfile 里的 aria2b/AriaNg/aria2c
          # 拉的是 GitHub Releases 最新版（curl + grep），缓存命中会让用户拿到旧版本

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          platform="${{ matrix.platform }}"
          printf 'PLATFORM_PAIR=%s\n' "${platform//\//-}" >> "$GITHUB_ENV"

      - name: 上传 digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: 合并 manifest（${{ matrix.variant }}）
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke-test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag_prefix: dev-       # 推 :dev-latest / :dev-<date>
          - variant: a2b
            tag_prefix: a2b-dev-   # 推 :a2b-dev-latest / :a2b-dev-<date>
    steps:
      - name: 设置版本标签
        id: set-version
        run: printf 'version=%s\n' "$(date +'%y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 下载 ${{ matrix.variant }} digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录到 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest 并推送（${{ matrix.variant }}）
        working-directory: /tmp/digests
        env:
          TAG_LATEST: ${{ matrix.tag_prefix }}latest
          TAG_DATED: ${{ matrix.tag_prefix }}${{ steps.set-version.outputs.version }}
        run: |
          refs=()
          for digest in *; do
            refs+=("${{ env.DOCKER_IMAGE }}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:${TAG_LATEST}" \
            -t "${{ env.DOCKER_IMAGE }}:${TAG_DATED}" \
            -t "${{ env.GHCR_IMAGE }}:${TAG_LATEST}" \
            -t "${{ env.GHCR_IMAGE }}:${TAG_DATED}" \
            "${refs[@]}"

      - name: 检查镜像（${{ matrix.variant }}）
        env:
          TAG_LATEST: ${{ matrix.tag_prefix }}latest
          TAG_DATED: ${{ matrix.tag_prefix }}${{ steps.set-version.outputs.version }}
        run: |
          docker buildx imagetools inspect "${{ env.DOCKER_IMAGE }}:${TAG_LATEST}"
          docker buildx imagetools inspect "${{ env.DOCKER_IMAGE }}:${TAG_DATED}"
          docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${TAG_LATEST}"
          docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${TAG_DATED}"

  smoke-test:
    name: 运行检查（${{ matrix.variant }}·${{ matrix.platform }}）
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # variant × platform 全组合：6 个 job
        # amd64 跑真实容器场景测试 + 容器内库级回归测试；
        # arm64 / arm/v7 只验证"启动成功 + aria2c/aria2b 真连通"，
        # 不跑完整文件处理场景（QEMU 仿真成本较高）
        variant:
          - standard
          - a2b
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
        include:
          - variant: standard
            rpc_port: 16800
            web_port: 18080
            a2b_enabled: "false"
          - variant: a2b
            rpc_port: 16801
            web_port: 18081
            a2b_enabled: "true"
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      # arm 容器在 x86 runner 上经 QEMU 仿真运行；amd64 不需要但 setup-qemu 无害
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 PLATFORM_PAIR
        run: |
          platform="${{ matrix.platform }}"
          printf 'PLATFORM_PAIR=%s\n' "${platform//\//-}" >> "$GITHUB_ENV"

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载 ${{ matrix.platform }} digest
        uses: actions/download-artifact@v8
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digest

      - name: 拉取镜像（按 digest，未发布 tag）
        id: pull
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          shopt -s nullglob
          digest_files=(/tmp/digest/*)
          if ((${#digest_files[@]} == 0)); then
            echo "digest 文件为空，artifact 异常"
            exit 1
          fi
          digest=${digest_files[0]##*/}
          ref="${GHCR_IMAGE}@sha256:${digest}"
          echo "image=${ref}" >> "$GITHUB_OUTPUT"
          # --platform 显式拉目标架构：build 的 push-by-digest 产出的是单架构 manifest，
          # digest 指向的 manifest list 仅含该架构条目。x86 host 上 docker pull 默认按
          # linux/amd64 匹配会 "no matching manifest"。指定 --platform 拉到本地后，
          # docker run 再经 QEMU 仿真执行（QEMU 只管 run 仿真，不管 pull 架构选择）
          docker pull --platform "${PLATFORM}" "${ref}"

      - name: 启动容器
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          IMAGE: ${{ steps.pull.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
          RPC_PORT: ${{ matrix.rpc_port }}
          WEB_PORT: ${{ matrix.web_port }}
          A2B_ENABLED: ${{ matrix.a2b_enabled }}
        run: |
          docker_args=(
            -d
            --name "${CONTAINER_NAME}"
            --platform "${PLATFORM}"
            -p "${RPC_PORT}:6800"
            -p "${WEB_PORT}:8080"
            -v "${CONTAINER_NAME}-config:/config"
            -v "${CONTAINER_NAME}-downloads:/downloads"
            -e SECRET=smoketoken
            -e UT=false
            -e RUT=false
            -e WEBUI=true
            -e PORT=6800
            -e WEBUI_PORT=8080
            -e "A2B=${A2B_ENABLED}"
          )

          if [ "${A2B_ENABLED}" = "true" ]; then
            docker_args+=(--cap-add NET_ADMIN)
            if [ -d /lib/modules ]; then
              docker_args+=(-v /lib/modules:/lib/modules:ro)
            fi
          fi

          # --platform 指定目标架构：image ref 是单架构 manifest list digest，
          # docker run 默认按宿主 linux/amd64 选条目会 "no matching manifest"；
          # 指定后选 arm 条目，经 QEMU 仿真执行
          docker run "${docker_args[@]}" "${IMAGE}"

      - name: 等待并检查服务
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          PLATFORM: ${{ matrix.platform }}
          RPC_PORT: ${{ matrix.rpc_port }}
          WEB_PORT: ${{ matrix.web_port }}
          A2B_ENABLED: ${{ matrix.a2b_enabled }}
        run: |
          echo "Observe container logs for 30 seconds before probing services..."
          timeout 30s docker logs -f "${CONTAINER_NAME}" || true
          echo "Start service probes."

          # aria2c 连通判定：jq -e '.result.version' 解析 JSON，不用 grep '"version"'——
          # 错误响应体里也可能含 "version" 字样（与 lib/tracker.sh 的 JSON 契约一致）
          #
          # a2b 连通判定分平台：
          #   amd64：断言 aria2b 就绪日志。旧版输出 "aria2b 已启动"，v2.2.0 输出
          #          "[aria2b] ... started!"；两者都只在 RPC 探测和 iptables/ipset
          #          初始化全部成功后才输出，比"进程存在"严格
          #   arm64/arm-v7：GHA ubuntu runner 内核未加载 ip_set/xt_set 模块，QEMU 仿真
          #          容器无法 modprobe，aria2b 的 ipset 初始化必失败（Cannot open session
          #          to kernel）。这是平台固有限制而非镜像 bug，故 arm 上 a2b 只验 aria2c
          #          RPC + WebUI；a2b 的完整连通由 amd64×a2b 兜底
          REQUIRE_A2B_READY=0
          if [ "${A2B_ENABLED}" = "true" ] && [ "${PLATFORM}" = "linux/amd64" ]; then
            REQUIRE_A2B_READY=1
          fi

          A2B_READY=0
          for _ in {1..30}; do
            if docker ps --filter "name=${CONTAINER_NAME}" --filter "status=running" --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}" \
              && curl -fsS "http://127.0.0.1:${RPC_PORT}/jsonrpc" \
                -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"2.0","method":"aria2.getVersion","id":"smoke","params":["token:smoketoken"]}' \
                > /tmp/aria2-rpc.json 2> /tmp/aria2-rpc.err \
              && jq -e '.result.version' /tmp/aria2-rpc.json >/dev/null \
              && curl -fsS "http://127.0.0.1:${WEB_PORT}/" >/dev/null 2> /tmp/aria2-web.err; then
              # aria2c RPC + WebUI 已就绪
              if [ "${A2B_ENABLED}" = "true" ] \
                && ! docker exec "${CONTAINER_NAME}" crontab -l \
                  | grep -Fq 's6-svc -r /var/run/s6/services/aria2b # restart-aria2b'; then
                echo "a2b 定时重启任务未使用 s6 服务重启命令"
                exit 1
              fi
              if [ "${REQUIRE_A2B_READY}" = "1" ]; then
                if docker logs "${CONTAINER_NAME}" 2>&1 \
                  | grep -Eq 'aria2b 已启动|\[aria2b\].*started!'; then
                  A2B_READY=1
                  echo "Smoke test passed (aria2c RPC + WebUI + aria2b 已就绪)"
                  exit 0
                fi
                # aria2b 可能还在 initial() 探测中，继续轮询
                sleep 2
                continue
              fi
              if [ "${A2B_ENABLED}" = "true" ]; then
                echo "Smoke test passed (aria2c RPC + WebUI；arm 平台不要求 aria2b iptables/ipset 初始化)"
              else
                echo "Smoke test passed (aria2c RPC + WebUI)"
              fi
              exit 0
            fi
            sleep 2
          done

          echo "=== Smoke test FAILED ==="
          if [ "${REQUIRE_A2B_READY}" = "1" ] && [ "${A2B_READY}" = "0" ]; then
            echo "a2b 变体（amd64）：未找到 aria2b 就绪日志（aria2b 未成功连上 aria2c 或进入 runIdleMode）"
          fi
          echo "=== docker ps -a ==="
          docker ps -a
          echo "=== RPC response (若有) ==="
          [ -f /tmp/aria2-rpc.json ] && cat /tmp/aria2-rpc.json || true
          echo "=== RPC error (若有) ==="
          [ -f /tmp/aria2-rpc.err ] && cat /tmp/aria2-rpc.err || true
          echo "=== WebUI error (若有) ==="
          [ -f /tmp/aria2-web.err ] && cat /tmp/aria2-web.err || true
          echo "=== docker logs (尾 200 行) ==="
          docker logs --tail 200 "${CONTAINER_NAME}" || true
          exit 1

      - name: WebUI s6 监管测试（${{ matrix.variant }}·仅 amd64）
        if: matrix.platform == 'linux/amd64'
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          WEB_PORT: ${{ matrix.web_port }}
        run: |
          service_dir=/var/run/s6/services/webui
          docker exec "${CONTAINER_NAME}" s6-svstat "${service_dir}" | grep -q '^up'
          before=$(docker exec "${CONTAINER_NAME}" pgrep -x darkhttpd)
          if [ -z "${before}" ]; then
            echo "WebUI 已连通但找不到 darkhttpd 进程"
            exit 1
          fi

          docker exec "${CONTAINER_NAME}" kill "${before}"
          for _ in {1..10}; do
            after=$(docker exec "${CONTAINER_NAME}" pgrep -x darkhttpd 2>/dev/null || true)
            if [ -n "${after}" ] && [ "${after}" != "${before}" ] \
              && curl -fsS "http://127.0.0.1:${WEB_PORT}/" >/dev/null; then
              echo "WebUI s6 监管生效：darkhttpd PID ${before} -> ${after}"
              exit 0
            fi
            sleep 1
          done

          echo "darkhttpd 退出后未被 s6 正常拉起"
          docker exec "${CONTAINER_NAME}" s6-svstat "${service_dir}" || true
          docker logs --tail 100 "${CONTAINER_NAME}" || true
          exit 1

      - name: WebUI 关闭与 standard A2B 误配置测试（standard·amd64）
        if: matrix.variant == 'standard' && matrix.platform == 'linux/amd64'
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}-webui-off
          IMAGE: ${{ steps.pull.outputs.image }}
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --platform linux/amd64 \
            -e SECRET=smoketoken \
            -e UT=false \
            -e RUT=false \
            -e WEBUI=false \
            -e A2B=true \
            "${IMAGE}"

          for _ in {1..15}; do
            if docker ps --filter "name=${CONTAINER_NAME}" --filter "status=running" \
              --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}" \
              && docker exec "${CONTAINER_NAME}" s6-svstat /var/run/s6/services/webui \
                | grep -q '^down' \
              && ! docker exec "${CONTAINER_NAME}" pgrep -x darkhttpd >/dev/null 2>&1 \
              && ! docker exec "${CONTAINER_NAME}" test -e /etc/services.d/aria2b/run \
              && docker exec "${CONTAINER_NAME}" sh -c \
                '! crontab -l | grep -Fq restart-aria2b'; then
              echo "WEBUI=false 保持 down；standard A2B=true 未注册无效服务或 cron"
              exit 0
            fi
            sleep 1
          done

          echo "WEBUI=false 或 standard A2B=true 防护异常"
          docker exec "${CONTAINER_NAME}" s6-svstat /var/run/s6/services/webui || true
          docker exec "${CONTAINER_NAME}" crontab -l || true
          docker exec "${CONTAINER_NAME}" ps -ef || true
          docker logs --tail 100 "${CONTAINER_NAME}" || true
          exit 1

      - name: 库级回归测试（abc 用户·${{ matrix.variant }}·仅 amd64）
        if: matrix.platform == 'linux/amd64'
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
        run: |
          docker cp .github/scripts/in-container-lib-test.sh \
            "${CONTAINER_NAME}":/tmp/in-container-lib-test.sh
          docker exec --user abc "${CONTAINER_NAME}" \
            bash /tmp/in-container-lib-test.sh

      - name: 真实容器场景测试（${{ matrix.variant }}·仅 amd64）
        # 使用本地 HTTP 与固定多文件 torrent；由 aria2 自动触发正式 hook，不依赖公网下载。
        if: matrix.platform == 'linux/amd64'
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          RPC_PORT: ${{ matrix.rpc_port }}
        run: |
          chmod +x .github/scripts/rpc-integration-test.sh
          .github/scripts/rpc-integration-test.sh \
            127.0.0.1 "${RPC_PORT}" smoketoken \
            "${CONTAINER_NAME}" "${{ matrix.variant }}" 8080

      - name: 失败时收集诊断信息
        if: failure()
        env:
          CONTAINER_NAME: aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
        run: |
          echo "=== docker ps -a ==="
          docker ps -a
          echo "=== docker logs (尾 200 行) ==="
          docker logs --tail 200 "${CONTAINER_NAME}" || true
          echo "=== /config 主要文件 ==="
          docker exec "${CONTAINER_NAME}" sh -c "
            cat /config/setting.conf 2>/dev/null
            echo '--- move.log ---'; tail -50 /config/logs/move.log 2>/dev/null
            echo '--- filter.log ---'; tail -50 /config/logs/文件过滤日志.log 2>/dev/null
          " || true

      - name: 清理容器
        if: always()
        run: |
          docker rm -f "aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}" || true
          docker rm -f "aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}-webui-off" || true
          docker volume rm \
            "aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}-config" \
            "aria2-smoke-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}-downloads" \
            || true
