name: Shell Lint

on:
  pull_request:
    paths:
      - 'root/**'
      - 'tests/**'
      - 'build.sh'
      - '.shellcheckrc'
      - '.github/workflows/**'
  push:
    branches:
      - master
      - dev
      - 'dev-*'
    paths:
      - 'root/**'
      - 'tests/**'
      - 'build.sh'
      - '.shellcheckrc'
      - '.github/workflows/**'

jobs:
  shell-lint:
    name: Shell 语法与 ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version

      - name: Shell 语法与 ShellCheck
        run: bash tests/lint.sh

  actionlint:
    name: GitHub Actions 编排检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 检查 workflow
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # Shell 脚本已由上面的 warning 级 ShellCheck 单独检查，避免重复且更严格的 info 噪音。
          args: -color -shellcheck= -pyflakes=
