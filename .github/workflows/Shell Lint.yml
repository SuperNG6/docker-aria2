name: Shell Lint

on:
  pull_request:
    paths:
      - 'root/**'
      - '.github/scripts/*.sh'
      - 'build.sh'
      - '.shellcheckrc'
      - '.github/workflows/Shell Lint.yml'
  push:
    branches:
      - master
      - dev
      - 'dev-*'
    paths:
      - 'root/**'
      - '.github/scripts/*.sh'
      - 'build.sh'
      - '.shellcheckrc'
      - '.github/workflows/Shell Lint.yml'

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version

      - name: 检查脚本
        run: |
          # 显式列举要检查的脚本，避免误扫 .conf / 二进制等非 shell 文件
          # severity=warning 抓真实问题（quoting/undefined var 等），跳过 style/info 噪音
          files=(
              root/aria2/scripts/lib/event.sh
              root/aria2/scripts/lib/log.sh
              root/aria2/scripts/lib/config.sh
              root/aria2/scripts/lib/files.sh
              root/aria2/scripts/lib/filter.sh
              root/aria2/scripts/lib/torrent.sh
              root/aria2/scripts/lib/rpc.sh
              root/aria2/scripts/lib/tracker.sh
              root/aria2/scripts/completed.sh
              root/aria2/scripts/start.sh
              root/aria2/scripts/stop.sh
              root/aria2/scripts/pause.sh
              root/etc/cont-init.d/11-version
              root/etc/cont-init.d/20-config
              root/etc/cont-init.d/30-config
              root/etc/cont-init.d/40-config
              root/etc/cont-init.d/50-config
              root/etc/cont-init.d/90-custom-folders
              root/etc/cont-init.d/99-custom-scripts
              root/etc/services.d/aria2/run
              root/etc/services.d/aria2b/run
              .github/scripts/rpc-integration-test.sh
              .github/scripts/in-container-lib-test.sh
              build.sh
          )
          shellcheck --severity=warning -x "${files[@]}"
