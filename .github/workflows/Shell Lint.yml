name: Shell Lint

on:
  pull_request:
    paths:
      - 'root/**'
      - '.github/scripts/*.sh'
      - 'build.sh'
      - '.shellcheckrc'
      - '.github/workflows/**'
  push:
    branches:
      - master
      - dev
      - 'dev-*'
    paths:
      - 'root/**'
      - '.github/scripts/*.sh'
      - 'build.sh'
      - '.shellcheckrc'
      - '.github/workflows/**'

jobs:
  shell-lint:
    name: Shell 语法与 ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version

      - name: 自动发现并检查 Shell 脚本
        run: |
          # 从 Git 跟踪文件中按 shebang 识别脚本，新增脚本无需手工维护清单。
          files=()
          while IFS= read -r -d '' file; do
            if head -n 1 "${file}" \
              | grep -Eq '^#!/(usr/bin/env (ba)?sh|bin/(ba)?sh|usr/bin/with-contenv (ba)?sh)($| )'; then
              files+=("${file}")
            fi
          done < <(git ls-files -z -- root .github/scripts build.sh)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "未发现 Shell 脚本" >&2
            exit 1
          fi

          printf '检查 %d 个 Shell 脚本：\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          bash -n "${files[@]}"
          shellcheck --severity=warning -x "${files[@]}"

  actionlint:
    name: GitHub Actions 编排检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 检查 workflow
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # Shell 脚本已由上面的 warning 级 ShellCheck 单独检查，避免重复且更严格的 info 噪音。
          args: -color -shellcheck= -pyflakes=
